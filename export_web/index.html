    // --- Web Audio Synthesizer for Sound Oasis ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.nodes = [];
        this.isPlaying = false;
        this.currentSound = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      stop() {
        this.nodes.forEach(n => {
          try { n.stop && n.stop(); n.disconnect && n.disconnect(); } catch (e) {}
        });
        this.nodes = [];
        this.isPlaying = false;
        this.currentSound = null;
      }
      playRain() {
        this.stop();
        this.init();
        const bufferSize = this.ctx.sampleRate * 2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 850;

        const gain = this.ctx.createGain();
        gain.gain.value = 0.25;

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();

        this.nodes = [noise, filter, gain];
        this.isPlaying = true;
        this.currentSound = 'rain';
      }
      playBinaural432() {
        this.stop();
        this.init();
        const osc = this.ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(432, this.ctx.currentTime);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();

        this.nodes = [osc, gain];
        this.isPlaying = true;
        this.currentSound = 'binaural';
      }
      playWaves() {
        this.stop();
        this.init();
        const bufferSize = this.ctx.sampleRate * 4;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 400;

        const gain = this.ctx.createGain();
        gain.gain.value = 0.2;

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();

        this.nodes = [noise, filter, gain];
        this.isPlaying = true;
        this.currentSound = 'waves';
      }
    }

    function GroundingScreen({ onBack }) {
      const steps = [
        { count: 5, sense: "حاسة البصر 👁️", prompt: "٥ أشياء تراها الآن بالعين في محيطك", eg: "مثل: كوب ماء، ضوء الشباك، يدك، حائط، هاتفك..." },
        { count: 4, sense: "حاسة اللمس ✋", prompt: "٤ أشياء تلمس ملمسها وحرارتها الآن", eg: "مثل: ملمس ملابسك، برودة الطاولة، نعومة الغطاء..." },
        { count: 3, sense: "حاسة السمع 👂", prompt: "٣ أصوات تميزها في المكان", eg: "مثل: صوت أنفاسك، صوت مروحة، صوت سيارة بعيدة..." },
        { count: 2, sense: "حاسة الشم 👃", prompt: "رائحتين تشمهما في الهواء", eg: "مثل: رائحة قهوة، هواء نقي، عطر ملابسك..." },
        { count: 1, sense: "التذوق والنفس 👅", prompt: "طعم تتذوقه، أو خذ نفساً عميقاً وقل: أنا هنا في أمان", eg: "رشفة ماء بوعي أو استشعار السكينة التامة." }
      ];
      const [stepIdx, setStepIdx] = useState(0);
      const [completed, setCompleted] = useState(false);
      const curr = steps[stepIdx];

      return (
        <div className="bg-white p-6 rounded-2xl border border-warmBeige space-y-4">
          <div className="flex items-center justify-between">
            <h2 className="text-lg font-bold text-darkGreen">تمرين التأريض الحسي 5-4-3-2-1 👁️</h2>
            <button onClick={onBack} className="text-xs text-sageGreen font-bold">← رجوع</button>
          </div>

          {!completed ? (
            <div className="text-center py-6 space-y-4">
              <div className="w-20 h-20 mx-auto rounded-full bg-softMint flex items-center justify-center text-4xl font-black text-darkGreen shadow-inner">
                {curr.count}
              </div>
              <span className="text-xs font-bold text-sageGreen bg-softMint/40 px-3 py-1 rounded-full">{curr.sense}</span>
              <h3 className="text-base font-bold text-darkGreen">{curr.prompt}</h3>
              <p className="text-xs text-textDark/70 bg-warmBeige/30 p-3 rounded-xl">{curr.eg}</p>

              <button
                onClick={() => {
                  if (stepIdx < steps.length - 1) setStepIdx(stepIdx + 1);
                  else setCompleted(true);
                }}
                className="w-full bg-darkGreen text-white py-3 rounded-xl font-bold text-sm shadow hover:bg-opacity-95 transition mt-4"
              >
                {stepIdx === steps.length - 1 ? "إنهاء والعودة للسكينة ✨" : "التالي ←"}
              </button>
            </div>
          ) : (
            <div className="text-center py-8 space-y-3">
              <div className="text-5xl">🌿</div>
              <h3 className="text-xl font-bold text-darkGreen">أحسنت! أنت الآن هنا وفي أمان تام</h3>
              <p className="text-sm text-textDark/80">أعدت عقلك الواعي إلى اللحظة الحاضرة وفصلت دائرة القلق.</p>
              <button onClick={onBack} className="bg-darkGreen text-white px-6 py-2.5 rounded-xl font-bold text-sm mt-4">
                العودة للرئيسية
              </button>
            </div>
          )}
        </div>
      );
    }

    // --- Gratitude Journal Component ---
    function JournalScreen({ notes, onAddNote, onDeleteNote, onBack }) {
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');
      const [tag, setTag] = useState('امتنان');
      const [mood, setMood] = useState('🌸');

      const handleAdd = () => {
        if (!content.trim()) return;
        onAddNote({
          id: Date.now(),
          title: title.trim() || `خاطرة ${tag}`,
          content: content.trim(),
          tag,
          mood,
          date: new Date().toLocaleDateString('ar-EG')
        });
        setTitle('');
        setContent('');
      };

      return (
        <div className="space-y-4">
          <div className="bg-white p-5 rounded-2xl border border-warmBeige shadow-sm space-y-3">
            <div className="flex justify-between items-center">
              <h2 className="font-bold text-darkGreen text-base">تدوين امتنان أو خاطرة جديدة ✨</h2>
              <button onClick={onBack} className="text-xs text-sageGreen font-bold">← رجوع</button>
            </div>

            <div className="flex gap-2">
              {['🌸', '☀️', '🌿', '🌊', '☕', '✨'].map(em => (
                <button
                  key={em}
                  onClick={() => setMood(em)}
                  className={`text-xl p-1 rounded-lg ${mood === em ? 'bg-softMint ring-2 ring-darkGreen' : 'bg-warmBeige/30'}`}
                >
                  {em}
                </button>
              ))}
            </div>

            <input
              type="text"
              placeholder="عنوان الخاطرة (اختياري)..."
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              className="w-full text-sm p-2.5 rounded-xl border border-warmBeige focus:outline-none focus:border-darkGreen"
            />
            <textarea
              rows="3"
              placeholder="ما الذي تشعر بالامتنان لوجوده اليوم؟"
              value={content}
              onChange={(e) => setContent(e.target.value)}
              className="w-full text-sm p-2.5 rounded-xl border border-warmBeige focus:outline-none focus:border-darkGreen"
            ></textarea>
            <button
              onClick={handleAdd}
              className="w-full bg-darkGreen text-white py-2.5 rounded-xl font-bold text-sm shadow hover:bg-opacity-95 transition"
            >
              حفظ في مفكرتي ✨
            </button>
          </div>

          <div className="space-y-2">
            <h3 className="font-bold text-darkGreen text-sm px-1">سجل الامتنان والمشاعر ({notes.length})</h3>
            {notes.map(n => (
              <div key={n.id} className="bg-white p-4 rounded-2xl border border-warmBeige shadow-sm space-y-1">
                <div className="flex justify-between items-center">
                  <div className="flex items-center gap-1.5 font-bold text-darkGreen text-sm">
                    <span>{n.mood}</span>
                    <span>{n.title}</span>
                  </div>
                  <button onClick={() => onDeleteNote(n.id)} className="text-xs text-red-500 hover:underline">حذف</button>
                </div>
                <p className="text-xs text-textDark/80 leading-relaxed">{n.content}</p>
                <div className="text-[10px] text-textDark/50 pt-1">{n.date} • {n.tag}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- Sound Oasis Component ---
    function SoundOasisScreen({ soundPlaying, setSoundPlaying, onBack }) {
      const sounds = [
        { id: 'rain', name: 'صوت المطر الهادئ', icon: '🌧️', play: () => soundEngine.playRain() },
        { id: 'waves', name: 'أمواج البحر والسكينة', icon: '🌊', play: () => soundEngine.playWaves() },
        { id: 'binaural', name: 'تردد 432Hz للسلام النفسي', icon: '🧘', play: () => soundEngine.playBinaural432() }
      ];

      const handleToggle = (s) => {
        if (soundPlaying === s.id) {
          soundEngine.stop();
          setSoundPlaying(null);
        } else {
          s.play();
          setSoundPlaying(s.id);
        }
      };

      return (
        <div className="bg-white p-6 rounded-2xl border border-warmBeige space-y-5">
          <div className="flex justify-between items-center">
            <div>
              <h2 className="text-lg font-bold text-darkGreen">واحة الأصوات المحيطية 🌿</h2>
              <p className="text-xs text-textDark/70">أصوات نقية ومولدة طبيعياً لتصفية الذهن والمساعدة على النوم.</p>
            </div>
            <button onClick={onBack} className="text-xs text-sageGreen font-bold">← رجوع</button>
          </div>

          <div className="space-y-3">
            {sounds.map(s => (
              <div
                key={s.id}
                onClick={() => handleToggle(s)}
                className={`p-4 rounded-2xl border cursor-pointer transition flex items-center justify-between ${soundPlaying === s.id ? 'bg-softMint border-darkGreen shadow' : 'bg-warmBeige/20 border-warmBeige hover:bg-warmBeige/40'}`}
              >
                <div className="flex items-center gap-3">
                  <span className="text-3xl">{s.icon}</span>
                  <div>
                    <h4 className="font-bold text-darkGreen text-sm">{s.name}</h4>
                    <span className="text-xs text-sageGreen">{soundPlaying === s.id ? 'قيد التشغيل الآن...' : 'انقر للتشغيل'}</span>
                  </div>
                </div>
                <span className="text-xl">{soundPlaying === s.id ? '⏸️' : '▶️'}</span>
              </div>
            ))}
          </div>

          {soundPlaying && (
            <button
              onClick={() => { soundEngine.stop(); setSoundPlaying(null); }}
              className="w-full bg-red-100 text-red-700 py-2.5 rounded-xl font-bold text-xs"
            >
              إيقاف الصوت الحالي
            </button>
          )}
        </div>
      );
    }

    // --- Library Component ---
    function LibraryScreen({ articles, selectedCategory, setSelectedCategory, onSelectArticle, onBack }) {
      const categories = ["الكل", "تمارين وتطبيقات", "ورش تطبيقية", "العلاقات", "الأسرة", "القلق والضغط"];
      const filtered = articles.filter(a => selectedCategory === "الكل" || a.category === selectedCategory);

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <h2 className="text-lg font-bold text-darkGreen">مكتبة نسمة حياة 📚</h2>
            <button onClick={onBack} className="text-xs text-sageGreen font-bold">← رجوع</button>
          </div>

          {/* Categories Horizontal Scroll */}
          <div className="flex gap-2 overflow-x-auto custom-scrollbar pb-1">
            {categories.map(cat => (
              <button
                key={cat}
                onClick={() => setSelectedCategory(cat)}
                className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${selectedCategory === cat ? 'bg-darkGreen text-white shadow' : 'bg-white border border-warmBeige text-textDark'}`}
              >
                {cat}
              </button>
            ))}
          </div>

          {/* Articles List */}
          <div className="space-y-2.5">
            {filtered.map(art => (
              <div
                key={art.id}
                onClick={() => onSelectArticle(art)}
                className="bg-white p-4 rounded-2xl border border-warmBeige shadow-sm hover:shadow cursor-pointer transition space-y-1"
              >
                <div className="flex justify-between items-center">
                  <span className="text-xs font-bold text-sageGreen bg-softMint/40 px-2 py-0.5 rounded-md">{art.category}</span>
                  <span className="text-[11px] text-textDark/50">{art.duration}</span>
                </div>
                <h3 className="font-bold text-darkGreen text-sm pt-1">{art.title}</h3>
                <p className="text-xs text-textDark/70 line-clamp-2 leading-relaxed">{art.description}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NesmatApp />);
  </script>
</body>
</html>
